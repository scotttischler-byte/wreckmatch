name: SEO live verify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Run production SEO checks
        run: node scripts/verify-seo-live.mjs
