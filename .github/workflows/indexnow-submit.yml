name: Submit IndexNow after publish

on:
  workflow_run:
    workflows:
      - "Publish SEO Content"
      - "Autopilot daily survival guide post"
      - "Autopilot bulk survival guide posts"
    types: [completed]
  workflow_dispatch:

jobs:
  indexnow:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Submit sitemaps to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node scripts/submit-indexnow.mjs wreckmatch || true
          node scripts/submit-indexnow.mjs asg || true
          node scripts/submit-indexnow.mjs injuredhelp || true
