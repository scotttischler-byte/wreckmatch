name: Publish SEO Content

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate city data
        run: node scripts/generate-city-data.mjs

      - name: Generate blog drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_POSTS_PER_DAY: "5"
        run: node scripts/generate-blog-batch.mjs

      - name: Publish from queue
        run: node scripts/publish-from-queue.mjs

      - name: Enrich and publish quality drafts
        run: npx tsx scripts/enrich-blog-drafts.ts --publish

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/posts content/blog/drafts data/publish-queue.json data/cities.generated.json
          git diff --staged --quiet || git commit -m "chore(seo): daily publish queue run"
          git push
