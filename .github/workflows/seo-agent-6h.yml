name: SEO Agent (every 6 hours — full sweep)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  full-sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Full SEO agent sweep
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/seo-agent.mjs full
          node scripts/seo-daily.mjs --skip-enrich --indexnow || true

      - name: Autopilot next city (if API key set)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — skipping autopilot"
            exit 0
          fi
          pip install -r scripts/autopilot_requirements.txt -q
          python scripts/accident_survival_guide_autopilot.py --sync-queue
          python scripts/accident_survival_guide_autopilot.py --next --publish-json || true
          node scripts/quality-gate-changed.mjs HEAD~1 || true

      - name: Commit all agent outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ ai-visibility-accelerator/output/content/city-posts/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(seo-agent): 6-hour full sweep"
          git push || true

      - name: IndexNow after content changes
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/submit-indexnow.mjs all --fallback || true
