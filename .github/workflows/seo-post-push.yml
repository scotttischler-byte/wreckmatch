name: SEO post-push (IndexNow + verify)

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "ai-visibility-accelerator/output/content/**"
      - "src/app/**"
      - "src/lib/**"
      - "data/**"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Wait for Vercel deploy (sitemap URL count)
        env:
          INDEXNOW_MIN_SITEMAP_URLS: "2500"
        run: |
          for i in $(seq 1 20); do
            count=$(curl -sf "https://www.wreckmatch.com/sitemap.xml" | grep -o '<loc>' | wc -l | tr -d ' ')
            echo "Attempt $i: $count URLs in production sitemap"
            if [ "${count:-0}" -ge "${INDEXNOW_MIN_SITEMAP_URLS}" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for full sitemap — submitting anyway"
      - name: Submit IndexNow (all domains)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_MIN_SITEMAP_URLS: "2500"
        run: node scripts/indexnow-after-content.mjs --recent || node scripts/submit-indexnow.mjs all --fallback || true

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Production SEO health check
        run: node scripts/verify-seo-live.mjs || true

      - name: Validate sitemap URL counts
        run: node scripts/validate-sitemaps.mjs || true
