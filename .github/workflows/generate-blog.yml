name: Generate daily blog posts

# Disabled — duplicates publish-seo.yml at 14:00 UTC. Use publish-seo.yml or workflow_dispatch here.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate blog drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_POSTS_PER_DAY: "5"
          BLOG_AUTO_PUBLISH: "false"
        run: node scripts/generate-blog-batch.mjs

      - name: Commit and push drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet || git commit -m "chore: add daily blog drafts"
          git push
